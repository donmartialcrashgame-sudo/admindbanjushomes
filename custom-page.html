<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0876df"><meta name="robots" content="noindex,nofollow"><title>Custom Admin Page | DBH</title><link rel="icon" href="/dbh-logo.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>:root{--blue:#0876df;--navy:#052b55;--ink:#18334e;--muted:#71849a;--line:#dce8f4}*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:var(--ink);font:14px Inter,system-ui,sans-serif}.admin-main{margin-left:265px;padding:25px;max-width:1450px;min-height:100vh}.back,.edit{border:1px solid var(--line);background:white;color:#315777;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.page{max-width:1100px;margin:20px auto;background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,44px);min-height:65vh;overflow-wrap:anywhere;border-top:5px solid var(--accent,#0876df)}.page h1,.page h2,.page h3{color:var(--navy)}.page p{line-height:1.85;color:#38536e}.page .notice{background:#eff7ff;border:1px solid #d8ebff;padding:14px;border-radius:10px;line-height:1.8}.page img{max-width:100%;height:auto;border-radius:12px}.page a{display:inline-block;background:var(--accent,#0876df);color:#fff;text-decoration:none;border-radius:9px;padding:10px 14px}.page hr{border:0;border-top:1px solid var(--line);margin:22px 0}.page .card{border:1px solid var(--line);padding:15px;border-radius:13px;margin:10px 0;box-shadow:0 8px 24px #052b5509}.page .stat{display:inline-grid;gap:5px;padding:14px;border-radius:12px;background:#edf6ff;margin:5px;min-width:120px}.page .stat strong{font-size:23px;color:var(--accent,#0876df)}.page table{width:100%;border-collapse:collapse}.page th,.page td{padding:9px;border:1px solid var(--line);text-align:left;font-size:12px}.page blockquote{border-left:4px solid var(--accent,#0876df);margin:14px 0;padding:8px 15px;background:#f6faff}.page details{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0}.page pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#102b45;color:#f2f7ff;border-radius:10px;padding:13px;font-size:11px}.muted{color:var(--muted);font-size:12px}@media(max-width:800px){.admin-main{margin-left:0!important;padding:14px}.page{padding:18px}}</style></head><body><aside id="dbhAdminSidebar"></aside><main class="admin-main"><div class="toolbar"><button class="back" id="back"><i class="fa-solid fa-arrow-left"></i> Settings</button><button class="edit" id="edit"><i class="fa-solid fa-pen"></i> Edit this page</button><button class="edit" id="tour"><i class="fa-solid fa-compass"></i> Builder tour</button></div><article class="page" id="page"><p class="muted">Loading page…</p></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/app.js?v=20261015-sidebar-fix-2"></script><script>(()=>{const el=document.getElementById('page'),slug=new URLSearchParams(location.search).get('slug');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function safeHref(h){h=String(h||'').trim();return h.startsWith('https://')||/^[a-zA-Z0-9_-]+\.html(?:[?#].*)?$/.test(h)?h:''}function safeImage(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch(e){return''}}function render(){let pages={};try{pages=JSON.parse(localStorage.getItem('dbhCustomPages')||'{}')||{}}catch(e){}const p=pages[slug];if(!p){el.innerHTML='<h1>Page not found</h1><p>This page may have been created in another browser or its local data was cleared.</p><a href="page-builder.html">Open Page Builder</a>';return}document.title=p.title+' | DBH Admin';const accent=p.theme==='green'?'#16804a':p.theme==='purple'?'#7653c7':p.theme==='dark'?'#052b55':'#0876df';el.style.setProperty('--accent',accent);el.innerHTML='<h1>'+esc(p.title)+'</h1>'+(p.intro?'<p>'+esc(p.intro).replace(/\n/g,'<br>')+'</p>':'')+(p.blocks||[]).map(b=>{if(b.type==='heading')return'<h2>'+esc(b.text)+'</h2>';if(b.type==='text')return'<p>'+esc(b.text).replace(/\n/g,'<br>')+'</p>';if(b.type==='notice')return'<div class="notice">'+esc(b.text).replace(/\n/g,'<br>')+'</div>';if(b.type==='divider')return'<hr>';if(b.type==='image'){const u=safeImage(b.href);return u?'<img src="'+esc(u)+'" alt="'+esc(b.text)+'">':''}if(b.type==='button'){const h=safeHref(b.href);return h?'<p><a href="'+esc(h)+'">'+esc(b.text||'Open link')+'</a></p>':''}if(b.type==='card'){const h=safeHref(b.href);return'<div class="card"><h3>'+esc(b.text)+'</h3><p>'+esc(b.detail).replace(/\n/g,'<br>')+'</p>'+(h?'<a href="'+esc(h)+'">Open</a>':'')+'</div>'}if(b.type==='list'){const tag=b.listStyle==='ol'?'ol':'ul';return'<'+tag+'>'+String(b.text||'').split('\n').filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('')+'</'+tag+'>'}if(b.type==='stat')return'<div class="stat"><span>'+esc(b.text)+'</span><strong>'+esc(b.value)+'</strong><small>'+esc(b.detail)+'</small></div>';if(b.type==='table'){const rows=String(b.text||'').split('\n').filter(Boolean).map(x=>x.split('|').map(y=>y.trim()));if(!rows.length)return'';return'<table><thead><tr>'+rows[0].map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(row=>'<tr>'+rows[0].map((_,i)=>'<td>'+esc(row[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}if(b.type==='quote')return'<blockquote>'+esc(b.text).replace(/\n/g,'<br>')+'</blockquote>';if(b.type==='accordion')return'<details><summary>'+esc(b.text)+'</summary><p>'+esc(b.detail).replace(/\n/g,'<br>')+'</p></details>';if(b.type==='code')return'<pre><small>'+esc(b.language||'text')+'</small>\n'+esc(b.text)+'</pre>';return''}).join('');document.getElementById('edit').onclick=()=>location.href='page-builder.html?edit='+encodeURIComponent(slug)}document.getElementById('back').onclick=()=>location.href='settings.html';document.getElementById('tour').onclick=()=>location.href='page-builder.html?tour=1';function init(){const s=window.DBHAdminApp?.supabase;if(s)s.auth.getSession().then(({data})=>{if(!data?.session){location.href='login.html';return}render()}).catch(render);else render()}window.addEventListener('dbh-admin-ready',init,{once:true});if(window.DBHAdminApp?.supabase)init()})();</script></body></html>
