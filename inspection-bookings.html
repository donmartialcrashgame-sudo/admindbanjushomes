<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Inspection Bookings | DBH Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fd;color:#12304d;font:14px Inter,system-ui,sans-serif}.admin-main{margin-left:265px;padding:28px;max-width:1500px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.head h1{margin:0}.head p{color:#71839a}.refresh,.action{border:0;border-radius:10px;padding:10px 14px;background:#0b63ce;color:#fff;font-weight:800;cursor:pointer}.list{display:grid;gap:13px;margin-top:22px}.card{background:#fff;border:1px solid #e1eaf3;border-radius:17px;padding:18px}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.muted{font-size:12px;color:#71839a;margin-top:6px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#fff3d8;color:#936000;font-size:10px;font-weight:900;text-transform:capitalize}.pill.confirmed{background:#e7f8ef;color:#16834f}.pill.declined{background:#fff0f0;color:#bd3547}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid #d9e4ef;border-radius:9px;background:#fff;padding:9px 12px;font-weight:800;cursor:pointer}.actions button.primary{background:#0b63ce;color:#fff}.empty{padding:40px;text-align:center;color:#71839a;background:#fff;border:1px dashed #cbd9e8;border-radius:16px}@media(max-width:800px){.admin-main{margin-left:0;padding:18px}}</style></head><body><div id="dbhAdminSidebar"></div><main class="admin-main"><div class="head"><div><h1><i class="fa-solid fa-calendar-check"></i> Inspection bookings</h1><p>All customer inspection requests, including DBH-managed properties.</p></div><button class="refresh" id="refresh"><i class="fa-solid fa-rotate"></i> Refresh</button></div><div id="bookings" class="list"><div class="empty">Loading bookings…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/app.js"></script><script>
(()=>{const S=window.supabase.createClient('https://cpgajlsyuieeengdnamy.supabase.co','sb_publishable_fbcJT-QGKyZg0tDkpbDkOQ_CcQf2ugW'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){ $('bookings').innerHTML='<div class="empty">Loading bookings…</div>';const auth=await S.auth.getSession();if(!auth.data.session){location.href='login.html';return}const staff=await S.functions.invoke('dbh-admin-staff',{body:{action:'access'}});if(staff.error||!staff.data?.ok){$('bookings').innerHTML='<div class="empty">Admin access could not be verified.</div>';return}const r=await S.from('inspection_bookings').select('*').order('created_at',{ascending:false}).limit(500);if(r.error){$('bookings').innerHTML='<div class="empty">Could not load bookings: '+esc(r.error.message)+'</div>';return}if(!r.data?.length){$('bookings').innerHTML='<div class="empty">No inspection bookings have been received yet.</div>';return}$('bookings').innerHTML=r.data.map(b=>'<article class="card"><div class="row"><div><strong>'+esc(b.property_title)+'</strong><div class="muted">Ref '+esc(b.property_code||'—')+' · Customer '+esc(b.customer_user_id)+'</div><div class="muted">Requested '+new Date(b.created_at).toLocaleString('en-NG')+' · Visit '+new Date(b.appointment_at).toLocaleString('en-NG',{dateStyle:'medium',timeStyle:'short'})+'</div><div class="muted">Owner: '+esc(b.owner_user_id||'DBH-managed listing')+'</div>'+(b.customer_note?'<div class="muted">Note: '+esc(b.customer_note)+'</div>':'')+'</div><span class="pill '+esc(b.status)+'">'+esc(b.status)+'</span></div>'+(b.status==='pending'?'<div class="actions"><button class="primary" data-status="confirmed" data-id="'+b.id+'">Confirm</button><button data-status="declined" data-id="'+b.id+'">Decline</button></div>':'')+'</article>').join('');document.querySelectorAll('[data-status]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;const q=await S.from('inspection_bookings').update({status:btn.dataset.status,responded_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',btn.dataset.id);if(q.error)alert(q.error.message);await load()})} $('refresh').onclick=load;load();})();
</script></body></html>
