<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0876df"><meta name="robots" content="noindex,nofollow"><title>Custom Page Builder | DBH Admin</title><link rel="icon" href="/dbh-logo.jpg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>
:root{--blue:#0876df;--navy:#052b55;--ink:#18334e;--muted:#71849a;--line:#dce8f4}*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:var(--ink);font:14px Inter,system-ui,sans-serif}.admin-main{margin-left:265px;padding:24px;max-width:1600px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.menu{display:inline-flex;border:1px solid var(--line);background:white;color:#315777;border-radius:10px;padding:10px 12px;cursor:pointer}.title{font-size:clamp(26px,3vw,38px);color:var(--navy);margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.7}.btn{border:1px solid var(--line);background:white;color:#315777;border-radius:10px;padding:10px 13px;font:800 11px Inter,system-ui,sans-serif;cursor:pointer}.primary{background:linear-gradient(135deg,#0757a6,#0788ee);color:white;border-color:transparent}.layout{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(320px,1.1fr);gap:16px;margin-top:20px}.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:15px}.ph{padding:15px 17px;border-bottom:1px solid #edf2f8;font-weight:900;color:var(--navy)}.pb{padding:16px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:10px;font-weight:900;color:#6f8399}.field input,.field select,.field textarea,.block textarea,.block input,.block select{width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfdff;font:12px Inter,system-ui,sans-serif;color:var(--ink)}.field textarea{min-height:65px;resize:vertical}.blocks{display:grid;gap:10px}.block{border:1px solid #dce8f4;border-radius:12px;padding:12px;background:#fbfdff}.blocktop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;font-size:11px;font-weight:900}.blockgrid{display:grid;gap:8px}.block textarea{min-height:65px}.block-actions{display:flex;gap:5px}.mini{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 9px;cursor:pointer;color:#486987}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.preview{min-height:420px;border:1px solid var(--line);border-radius:12px;padding:22px;background:white;overflow-wrap:anywhere}.preview h1,.preview h2,.preview h3{color:var(--navy)}.preview .notice{background:#eff7ff;border:1px solid #d8ebff;padding:13px;border-radius:10px}.preview img{max-width:100%;height:auto;border-radius:10px}.preview a{display:inline-block;background:#0876df;color:#fff;text-decoration:none;border-radius:9px;padding:10px 13px}.preview hr{border:0;border-top:1px solid var(--line);margin:20px 0}.status{font-size:11px;color:#14804a;min-height:20px;margin-top:8px}@media(max-width:1050px){.layout{grid-template-columns:1fr}}@media(max-width:800px){.admin-main{margin-left:0!important;padding:14px}.menu{display:inline-flex}.preview{padding:15px}.top .btn{flex:1}} 
</style></head><body><aside id="dbhAdminSidebar"></aside><main class="admin-main"><div class="top"><div style="display:flex;align-items:flex-start;gap:12px"><button class="menu" id="adminMenu" type="button" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button><div><div style="color:#0876df;font-size:10px;font-weight:950;letter-spacing:.16em">CUSTOM PAGE TOOLS</div><h1 class="title">Page Builder</h1><p class="muted">Build an inner admin page with reusable content blocks and preview it before saving.</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="back"><i class="fa-solid fa-arrow-left"></i> Settings</button><button class="btn primary" id="save"><i class="fa-solid fa-floppy-disk"></i> Save page & add link</button></div></div><div class="layout"><section class="panel"><div class="ph"><i class="fa-solid fa-wand-magic-sparkles"></i> Page setup and tools</div><div class="pb"><div class="field"><label for="pageTitle">PAGE TITLE</label><input id="pageTitle" maxlength="70" placeholder="Page title"></div><div class="field"><label for="category">SIDEBAR CATEGORY</label><select id="category"><option>AUTHENTICATION</option><option>OVERVIEW</option><option>CUSTOMER SECTION</option><option>AGENT SECTION</option><option>PROPERTY MANAGEMENT</option><option>PLATFORM</option><option>ADMIN TOOLS</option><option>CUSTOM LINKS</option></select></div><div class="field"><label for="intro">SHORT INTRODUCTION (OPTIONAL)</label><textarea id="intro" maxlength="400" placeholder="Explain what this page is for"></textarea></div><div class="toolbar"><button class="btn" data-add="heading"><i class="fa-solid fa-heading"></i> Heading</button><button class="btn" data-add="text"><i class="fa-solid fa-align-left"></i> Text</button><button class="btn" data-add="notice"><i class="fa-solid fa-circle-info"></i> Notice</button><button class="btn" data-add="button"><i class="fa-solid fa-link"></i> Button</button><button class="btn" data-add="image"><i class="fa-regular fa-image"></i> Image</button><button class="btn" data-add="divider"><i class="fa-solid fa-minus"></i> Divider</button></div><div id="blocks" class="blocks"></div><div id="status" class="status" role="status"></div></div></section><section class="panel"><div class="ph"><i class="fa-regular fa-eye"></i> Live preview</div><div class="pb"><div id="preview" class="preview"></div><p class="muted">Preview updates as you edit. Pages and sidebar links are saved in this browser's local storage.</p></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/app.js?v=20261015-sidebar-fix-1"></script><script>
(()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),KEY='dbhCustomPages',NAV='dbhSidebarCustomizations';let blocks=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slugify=s=>String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,55)||'custom-page';function defaults(type){return{type,heading:{text:'Section heading'},text:{text:'Write your content here.'},notice:{text:'Important information for staff.'},button:{text:'Open link',href:'settings.html'},image:{text:'',href:'https://'},divider:{text:''}}[type]||{type,text:''}}function renderBlocks(){ $('blocks').innerHTML=blocks.map((b,i)=>'<div class="block" data-i="'+i+'"><div class="blocktop"><span><i class="fa-solid '+({heading:'fa-heading',text:'fa-align-left',notice:'fa-circle-info',button:'fa-link',image:'fa-image',divider:'fa-minus'}[b.type]||'fa-cube')+'"></i> '+esc(b.type.toUpperCase())+'</span><div class="block-actions"><button class="mini" data-move="up" title="Move up" '+(i===0?'disabled':'')+'><i class="fa-solid fa-arrow-up"></i></button><button class="mini" data-move="down" title="Move down" '+(i===blocks.length-1?'disabled':'')+'><i class="fa-solid fa-arrow-down"></i></button><button class="mini" data-remove title="Remove"><i class="fa-solid fa-trash"></i></button></div></div><div class="blockgrid">'+(b.type==='divider'?'<span class="muted">A horizontal divider will appear here.</span>':b.type==='button'?'<input data-field="text" value="'+esc(b.text)+'" placeholder="Button label"><input data-field="href" value="'+esc(b.href)+'" placeholder="settings.html or https://…">':b.type==='image'?'<input data-field="href" value="'+esc(b.href)+'" placeholder="https:// image URL"><input data-field="text" value="'+esc(b.text)+'" placeholder="Image alt text">':'<textarea data-field="text" placeholder="'+(b.type==='heading'?'Heading text':'Content text')+'">'+esc(b.text)+'</textarea>')+'</div></div>').join('');renderPreview()}function safeHref(h){h=String(h||'').trim();return /^(https:\/\/|[a-zA-Z0-9_-]+\.html(?:[?#].*)?)$/.test(h)?h:''}function renderPreview(){const title=esc($('pageTitle').value||'Untitled page'),intro=$('intro').value.trim();$('preview').innerHTML='<h1>'+title+'</h1>'+(intro?'<p>'+esc(intro).replace(/\n/g,'<br>')+'</p>':'')+blocks.map(b=>{if(b.type==='heading')return'<h2>'+esc(b.text)+'</h2>';if(b.type==='text')return'<p>'+esc(b.text).replace(/\n/g,'<br>')+'</p>';if(b.type==='notice')return'<div class="notice">'+esc(b.text).replace(/\n/g,'<br>')+'</div>';if(b.type==='divider')return'<hr>';if(b.type==='image'){const u=safeImage(b.href);return u?'<img src="'+esc(u)+'" alt="'+esc(b.text)+'">':'<p class="muted">Enter a valid https image URL to preview it.</p>'}if(b.type==='button'){const h=safeHref(b.href);return h?'<p><a href="'+esc(h)+'">'+esc(b.text||'Open link')+'</a></p>':'<p class="muted">Enter a valid local page or https URL for this button.</p>'}return''}).join('')}function safeImage(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch(e){return''}}function save(){const title=$('pageTitle').value.trim();if(!title){$('status').textContent='Enter a page title first.';return}for(const b of blocks){if(b.type==='button'&&!safeHref(b.href)){$('status').textContent='Buttons need a local .html link or https:// URL.';return}if(b.type==='image'&&b.href&&!safeImage(b.href)){$('status').textContent='Images must use a valid https:// URL.';return}}const slug=slugify(title),href='custom-page.html?slug='+encodeURIComponent(slug);let pages={};let cfg={};try{pages=JSON.parse(localStorage.getItem(KEY)||'{}')||{};cfg=JSON.parse(localStorage.getItem(NAV)||'{}')||{}}catch(e){}pages[slug]={title,category:$('category').value,intro:$('intro').value.trim(),blocks,updatedAt:new Date().toISOString()};cfg.custom=Array.isArray(cfg.custom)?cfg.custom:[];const old=cfg.custom.find(x=>x.slug===slug||x.href===href);if(old){old.label=title;old.href=href;old.category=$('category').value;old.slug=slug}else cfg.custom.push({label:title,href,category:$('category').value,slug,icon:'file-lines'});localStorage.setItem(KEY,JSON.stringify(pages));localStorage.setItem(NAV,JSON.stringify(cfg));$('status').textContent='Saved! Opening your new page…';window.dispatchEvent(new CustomEvent('dbh-sidebar-settings-changed'));setTimeout(()=>location.href=href,250)}document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{blocks.push(defaults(b.dataset.add));renderBlocks()}));$('blocks').addEventListener('input',e=>{const el=e.target.closest('[data-field]');if(!el)return;const block=blocks[Number(el.closest('[data-i]').dataset.i)];block[el.dataset.field]=el.value;renderPreview()});$('blocks').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const wrap=btn.closest('[data-i]'),i=Number(wrap.dataset.i);if(btn.hasAttribute('data-remove'))blocks.splice(i,1);else if(btn.dataset.move){const j=btn.dataset.move==='up'?i-1:i+1;if(j>=0&&j<blocks.length)[blocks[i],blocks[j]]=[blocks[j],blocks[i]]}renderBlocks()});['pageTitle','intro','category'].forEach(id=>$(id).addEventListener('input',renderPreview));$('save').addEventListener('click',save);$('back').addEventListener('click',()=>location.href='settings.html');$('pageTitle').value=q.get('label')||'';$('category').value=q.get('category')||'AUTHENTICATION';blocks=[defaults('heading'),defaults('text')];renderBlocks();renderPreview();function init(){const s=window.DBHAdminApp?.supabase;if(s)s.auth.getSession().then(({data})=>{if(!data?.session)location.href='login.html'}).catch(()=>{})}window.addEventListener('dbh-admin-ready',init,{once:true});if(window.DBHAdminApp?.supabase)init()})();
</script></body></html>
