<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Staff | DBH</title><link rel="icon" href="https://dbanjushomes-com.onrender.com/dbh-logo.jpg"><style>:root{--b:#0b63ce;--d:#062b52;--ink:#10233d;--m:#64748b;--line:#dce8f4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f1f7ff,#fff);font:14px Inter,system-ui,sans-serif;color:var(--ink)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;color:var(--d);font-weight:900;margin-bottom:18px}.brand img{width:42px;height:42px;border-radius:12px}.nav{display:grid;gap:5px}.nav a{display:flex;gap:11px;padding:12px;border-radius:12px;color:#526275;text-decoration:none;font-weight:800;font-size:11px}.nav a:hover,.nav a.active{background:#eaf3ff;color:var(--b)}.main{padding:28px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.ey{font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--b)}h1{margin:7px 0 4px;font-size:32px;color:var(--d)}.sub{margin:0;color:var(--m)}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 16px 40px #062b5209;margin-bottom:18px}.form{display:grid;grid-template-columns:1.1fr 1fr .8fr auto;gap:10px}.input,select{width:100%;border:1px solid #d4e1ee;border-radius:12px;padding:13px;background:#f8fbff;outline:0}.input:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 4px #0b63ce12}.btn{border:0;border-radius:12px;padding:13px 17px;background:linear-gradient(135deg,var(--b),#0ea5e9);color:#fff;font-weight:900;cursor:pointer}.msg{min-height:20px;margin-top:10px;font-size:12px;color:#b91c1c}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #edf2f7;text-align:left;font-size:12px}.table th{color:#64748b;font-size:10px;letter-spacing:.08em}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eaf3ff;color:var(--b);font-size:10px;font-weight:900}.pill.off{background:#fff1f2;color:#be123c}.actions{display:flex;gap:7px}.mini{border:1px solid #d7e4f0;background:#fff;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:900;cursor:pointer}.menu{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:fixed;left:-270px;z-index:20;width:250px;transition:.25s}.side.open{left:0}.menu{display:inline-flex;border:0;background:#fff;border-radius:10px;padding:10px}.main{padding:18px}.form{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><div class="layout"><aside class="side" id="side"><div class="brand"><img src="https://dbanjushomes-com.onrender.com/dbh-logo.jpg"><span>DBH ADMIN<br><small>CONTROL CENTRE</small></span></div><nav class="nav"><a href="index.html">Dashboard</a><a href="users.html">Users</a><a href="agents.html">Agents</a><a href="properties.html">Properties</a><a href="payments.html">Payments</a><a href="documents.html">Documents</a><a href="notifications.html">Notifications</a><a href="reports.html">Reports</a><a class="active" href="admin-staff.html">Admin Staff</a><a href="tools.html">Admin Tools</a><a href="settings.html">Settings</a></nav></aside><main class="main"><button class="menu" id="menu">☰</button><header class="top"><div><div class="ey">DBH ADMIN CENTRE · STAFF</div><h1>Admin Staff</h1><p class="sub">Invite staff and control their DBH administration access.</p></div></header><section class="panel"><form id="form" class="form"><input class="input" id="name" placeholder="Full name" required><input class="input" id="email" type="email" placeholder="Staff email" required><select id="role"><option value="admin">Admin</option><option value="moderator">Moderator</option><option value="finance">Finance</option><option value="support">Support</option><option value="super_admin">Super Admin</option></select><button class="btn">Invite staff</button></form><div class="msg" id="msg"></div></section><section class="panel"><table class="table"><thead><tr><th>STAFF</th><th>CODE</th><th>ROLE</th><th>STATUS</th><th>LAST LOGIN</th><th>ACTION</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading staff…</td></tr></tbody></table></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S=supabase.createClient('https://cpgajlsyuieeengdnamy.supabase.co','sb_publishable_fbcJT-QGKyZg0tDkpbDkOQ_CcQf2ugW'),$=id=>document.getElementById(id);async function call(action,body={}){const{data,error}=await S.functions.invoke('dbh-admin-staff',{body:{action,...body}});if(error)throw error;return data}async function boot(){const{data:{session}}=await S.auth.getSession();if(!session){location.href='login.html';return}try{const r=await call('list');render(r.staff||[])}catch(e){$('msg').textContent=e.message||'Admin access denied.'}}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(items){if(!items.length){$('rows').innerHTML='<tr><td colspan="6">No admin staff yet.</td></tr>';return}let html='';items.forEach(x=>{html+='<tr><td><b>'+esc(x.full_name)+'</b><br><small>'+esc(x.email)+'</small></td><td>'+esc(x.staff_code||'—')+'</td><td><select onchange="changeStaff(\''+x.id+'\',this.value,\''+x.status+'\')"><option value="admin" '+(x.role==='admin'?'selected':'')+'>admin</option><option value="moderator" '+(x.role==='moderator'?'selected':'')+'>moderator</option><option value="finance" '+(x.role==='finance'?'selected':'')+'>finance</option><option value="support" '+(x.role==='support'?'selected':'')+'>support</option><option value="super_admin" '+(x.role==='super_admin'?'selected':'')+'>super_admin</option></select></td><td><span class="pill '+(x.status==='active'?'':'off')+'">'+esc(x.status)+'</span></td><td>'+(x.last_login_at?new Date(x.last_login_at).toLocaleString():'Never')+'</td><td><button class="mini" onclick="toggleStaff(\''+x.id+'\',\''+x.status+'\')">'+(x.status==='active'?'Suspend':'Activate')+'</button></td></tr>'});$('rows').innerHTML=html}window.toggleStaff=async(id,status)=>{try{await call('update',{id,role:'admin',status:status==='active'?'suspended':'active'});boot()}catch(e){$('msg').textContent=e.message||'Could not update staff.'}};window.changeStaff=async(id,role,status)=>{try{await call('update',{id,role,status});boot()}catch(e){$('msg').textContent=e.message||'Could not update staff.'}};$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Sending invitation…';try{const r=await call('invite',{full_name:$('name').value.trim(),email:$('email').value.trim(),role:$('role').value});$('msg').textContent=r.invited?'Invitation sent and staff access created.':'Existing user added to admin staff.';e.target.reset();boot()}catch(err){$('msg').textContent=err.message||'Could not add staff.'}};$('menu').onclick=()=>$('side').classList.toggle('open');boot();</script></body></html>
